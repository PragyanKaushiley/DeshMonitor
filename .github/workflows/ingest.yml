name: Ingest

# Started on time by the Cloudflare cron (apps/api src/scheduled.ts) through
# workflow_dispatch, or by hand from the Actions tab. The schedule below is a
# fallback a little after each cron slot: it runs only the jobs the cron
# hasn't already dispatched recently (12 minutes for news, 40 for weather).
# Keep it in step with jobsDue() in apps/api.
run-name: "${{ github.event_name == 'workflow_dispatch' && format('ingest: {0}', inputs.job) || format('ingest (fallback) {0}', github.event.schedule) }}"

on:
  workflow_dispatch:
    inputs:
      job:
        description: Ingest job to run
        required: true
        type: choice
        options:
          - news
          - weather-forecast
          - weather-air-quality
          - weather-marine
          - weather-flood
          - weather-seasonal
          - weather-climate
          - logs-prune
  schedule:
    - cron: "12,27,42,57 * * * *" # news (cron: every 15 min from :05)
    - cron: "40 * * * *" # weather-forecast, weather-air-quality, weather-marine (cron: hourly at :05)
    - cron: "40 1 * * *" # weather-flood (cron: 01:05 daily)
    - cron: "40 2 * * 1" # weather-seasonal (cron: Mondays 02:05)
    - cron: "40 3 1 * *" # weather-climate (cron: the 1st, 03:05)
    - cron: "40 0 * * *" # logs-prune (cron: 00:05 daily)

permissions:
  contents: read
  actions: read

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          INPUT_JOB: ${{ inputs.job }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "jobs=$(jq -cn '[$job]' --arg job "$INPUT_JOB")" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Jobs for this fallback slot, and how far back a dispatched run of
          # the same job counts as "already ran".
          case "$SCHEDULE" in
            "12,27,42,57 * * * *") due="news"; window=12 ;;
            "40 * * * *") due="weather-forecast weather-air-quality weather-marine"; window=40 ;;
            "40 1 * * *") due="weather-flood"; window=40 ;;
            "40 2 * * 1") due="weather-seasonal"; window=40 ;;
            "40 3 1 * *") due="weather-climate"; window=40 ;;
            "40 0 * * *") due="logs-prune"; window=40 ;;
            *) echo "::error::unknown schedule '$SCHEDULE'"; exit 1 ;;
          esac

          since=$(date -u -d "$window minutes ago" +%Y-%m-%dT%H:%M:%SZ)
          recent=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ingest.yml --event workflow_dispatch \
            --created ">=$since" --limit 100 --json displayTitle --jq '.[].displayTitle')

          jobs=()
          for job in $due; do
            if grep -qxF "ingest: $job" <<<"$recent"; then
              echo "::notice::$job was already dispatched by the Cloudflare cron; skipping"
            else
              jobs+=("$job")
            fi
          done
          echo "jobs=$(jq -cn '$ARGS.positional' --args "${jobs[@]}")" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    if: needs.plan.outputs.jobs != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        job: ${{ fromJSON(needs.plan.outputs.jobs) }}
    # Never two runs of the same job at once; a new one waits for the last.
    concurrency:
      group: ingest-${{ matrix.job }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          runtime: node@20
          cache: true
          install: false

      # Only the ingest app and the workspace packages it depends on.
      - run: pnpm install --frozen-lockfile --filter "@desh-monitor/ingest..."

      # Ingest jobs are the package's fetch:<job> scripts; logs-prune is
      # its maintenance script.
      - run: |
          script="fetch:${JOB}"
          [ "$JOB" = "logs-prune" ] && script="prune:logs"
          pnpm --filter @desh-monitor/ingest run "$script"
        env:
          JOB: ${{ matrix.job }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
