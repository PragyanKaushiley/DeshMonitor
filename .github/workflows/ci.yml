name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # pnpm (version from "packageManager") and Node in one step. Node 20
      # matches local development: wrangler and OpenNext are pinned to
      # versions that support it. Installs run explicitly below.
      - uses: pnpm/setup@v3
        with:
          runtime: node@20
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # No database or Redis credentials here, so the integration tests skip
      # themselves; unit tests run.
      - run: pnpm test

      - run: pnpm --filter @desh-monitor/web build

  # Every push to main that passes the checks is deployed: database
  # migrations, then the API, then the website. Skipped (with a notice) until
  # the CLOUDFLARE_API_TOKEN secret exists.
  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # One deploy at a time; a newer push waits rather than cancelling one
    # that is mid-way.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # Not a secret: identifies the Cloudflare account to deploy to.
      CLOUDFLARE_ACCOUNT_ID: 1b7ba66bfcc585a4a11c4f33bd213972
    steps:
      - id: token
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN is not set; skipping deploy"
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v7

      - if: steps.token.outputs.present == 'true'
        uses: pnpm/setup@v3
        with:
          runtime: node@20
          cache: true
          install: false

      - if: steps.token.outputs.present == 'true'
        run: pnpm install --frozen-lockfile

      # Migrations are additive and tracked, so re-running is a no-op.
      - if: steps.token.outputs.present == 'true'
        name: Apply database migrations
        run: pnpm --filter @desh-monitor/db run db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - if: steps.token.outputs.present == 'true'
        name: Deploy API
        run: pnpm --filter @desh-monitor/api exec wrangler deploy

      # The API URL is baked into the web build.
      - if: steps.token.outputs.present == 'true'
        name: Deploy website
        run: pnpm --filter @desh-monitor/web run deploy
        env:
          NEXT_PUBLIC_API_URL: https://api.deshmonitor.com

      - if: steps.token.outputs.present == 'true'
        name: Smoke test
        run: |
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors https://api.deshmonitor.com/health
          echo
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null -w "home page: HTTP %{http_code}\n" https://deshmonitor.com/
