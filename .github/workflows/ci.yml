name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # pnpm (version from "packageManager") and Node in one step. Node 20
      # matches local development: wrangler and OpenNext are pinned to
      # versions that support it. Installs run explicitly below.
      - uses: pnpm/setup@v3
        with:
          runtime: node@20
          cache: true
          install: false

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # No database or Redis credentials here, so the integration tests skip
      # themselves; unit tests run.
      - run: pnpm test

      - run: pnpm --filter @desh-monitor/web build
